# Deploy: fly launch --config companion/fly.toml  (from repo root)
# or:     cd companion && fly launch
#
# After first deploy, set:
#   fly secrets set CORS_ORIGINS=https://your-playground.example.com
# Optional:
#   fly secrets set CORS_ORIGIN_REGEX='https://.*\.github\.io'

app = "python-live-companion"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
