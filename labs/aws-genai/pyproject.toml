[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-live-aws-genai-lab"
version = "0.1.0"
description = "Offline-first Bedrock and deterministic tool authorization lab"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]
langchain = ["langchain>=1.4.7,<2", "langchain-aws>=1.9.1,<2"]

[project.scripts]
aws-genai-lab = "aws_genai_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

